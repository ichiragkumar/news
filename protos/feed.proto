syntax = "proto3";

package feed;


service FeedService {
    rpc GedFeed(GetFeedRequest) returns (GetFeedResponse);
}


message GetFeedRequest{
    string userId = 1;
}



message FeedItem {
   string id = 1;
   string title = 2;
   string category = 3;
}




message GetFeedResponse{
    repeated FeedItem items = 1;
}